{% extends "base.html" %}
<!-- {% import "bootstrap/wtf.html" as wtf %} -->

{% block title %}Main Page{% endblock %}

{% block content %}

<div class="greeting-row">
    <h2 class="greeting-text">Your alarms</h2>
</div>

<div class="main-boxes">

    <div class="rg-box alarms-box">
        <ul class="alarm-list">
            <li>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="toggle-track">
                        <span class="toggle-label-on">ON</span>
                        <span class="toggle-label-off">OFF</span>
                        <span class="toggle-thumb"></span>
                    </span>
                </label>
                <span class="alarm-time">7:15 AM</span>
                <span class="alarm-days">Monday - Friday</span>
            </li>
            <li>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="toggle-track">
                        <span class="toggle-label-on">ON</span>
                        <span class="toggle-label-off">OFF</span>
                        <span class="toggle-thumb"></span>
                    </span>
                </label>
                <span class="alarm-time">6:30 AM</span>
                <span class="alarm-days">Thursday</span>
            </li>
        </ul>

    </div>

</div>


{% endblock %}
